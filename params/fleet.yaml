# Car fleet (parc) and tailpipe emissions model: assumptions for zevm.fleet
#
# Ported from archive/notebooks/01) UK Car Scenarios.ipynb, Parts 1-3. Where a value
# is an assumption rather than a sourced figure, it says so. Every value can be
# overridden in a smaller file with `extends: fleet.yaml` (see zevm.rules).
#
# Conventions
# - Fuel groups: petrol, diesel, hybrid, bev. How DfT fuel types map onto them is in
#   zevm/fleet.py (DFT_FUEL_MAP). "hybrid" = petrol hybrids (mild, full, plug-in) and
#   range-extended; diesel hybrids and diesel plug-ins sit in "diesel"; fuel cell sits
#   in "bev". Gas and other fuels (~0.4% of the parc) are left out.
# - Year tables carry forward, as in params/vets.yaml.

name: UK car fleet, archive notebook 01 assumptions

vehicle_type: car

# Base year: the stock model starts from the year-end (Q4) parc in VEH0105/VEH0142.
# null = the latest year with a Q4 column in the files in data/.
base_year: null

retirement:
  # Cars leave the parc `lifespan_years` after first registration, spread evenly over
  # `spread_years` years centred on that age (ages 14-23 with 18 and 10). This is the
  # notebook's "18-year lifespan + 10-year centred rolling mean" of registrations.
  # Assumption from the notebook: 18 years is close to the SMMT average scrappage age
  # (~14-15 years) plus the long tail; 10 years smooths the 2005/2015 sales cycles.
  lifespan_years: 18
  spread_years: 10
  # The cohorts registered in the last ~lifespan years do not add up to today's parc
  # (old cars outlive the assumed lifespan, and there is import/export). So retirements
  # of cars already on the road are scaled per fuel until the existing stock retires
  # exactly. This is the notebook's "retirement factor". Unlike the notebook, the
  # factor is not applied to cars registered after the base year.

registrations:
  # Shares of non-ZEV new registrations, DfT VEH1153 fuel definitions (so "hybrid"
  # includes mild hybrids, unlike SMMT HEV). Petrol is the remainder.
  # Observed UK 2023 (VEH1153a): petrol 0.552, diesel 0.090, hybrid 0.359.
  # 2024 on is an ASSUMPTION: hybrid share of non-ZEV rises 4pp a year to 60% (it rose
  # ~6pp a year 2019-2023), diesel keeps falling slowly. The notebook used diesel =
  # 2023 diesel share of ICE - 10pp and hybrid = 40% of the rest.
  nonzev_split:
    hybrid: {2024: 0.40, 2025: 0.44, 2026: 0.48, 2027: 0.52, 2028: 0.56, 2029: 0.60}
    diesel: {2024: 0.08, 2025: 0.07, 2026: 0.06, 2028: 0.05}
  # VES registrations in GB-only scheme years (params/vets.yaml `geography`) are scaled
  # to UK by the mean UK/GB ratio of DfT car registrations (VEH1153, 2015 on, ~1.02).
  scale_gb_to_uk: true

mileage:
  # Mean annual miles per car by fuel, from MOT odometer readings
  # (data/cars_average_mileage.csv, BigQuery query "Annual Welsh Car Mileage by Fueltype").
  # Years after the last observed year hold the last value, changed by `annual_change`.
  file: data/cars_average_mileage.csv
  first_year: 2007          # earlier rows are unreliable (e.g. petrol 54,950 in 2005)
  annual_change: {petrol: 0.0, diesel: 0.0, hybrid: 0.0, bev: 0.0}   # assumption: flat

fuel_use:
  # Fuel used per vehicle mile is calibrated from history: DESNZ sub-national road
  # transport fuel consumption (petrol and diesel cars, ktoe, UK row K02000001)
  # divided by modelled vehicle miles (parc x mileage).
  file: data/sub-national-road-transport-fuel-consumption-statistics-2005-2020.ods
  calibration_years: 3      # mean of the last N years with fuel data (notebook: 3)
  # Left out of the calibration: lockdown years, when MOT-based mileage and fuel sales
  # moved differently (fuel per mile 15% below 2019 in 2020).
  exclude_years: [2020, 2021]
  # Petrol burnt by hybrids vs pure petrol cars, per mile. Notebook assumption: hybrids
  # have ~0.7x the WLTP CO2/km of petrol cars. Used to split "petrol cars" fuel.
  hybrid_vs_petrol: 0.7
  # New cars registered after the base year use this much fuel per mile relative to
  # the base-year fleet average of their fuel. ASSUMPTION, standing in for the
  # notebook's "new petrol 40 mpg, new hybrid 60 mpg" (diesel was held flat).
  new_vs_fleet: {petrol: 0.85, diesel: 1.0, hybrid: 0.80}
  # Further change per registration year after base_year + 1 (negative = better).
  # Assumption: flat. Set e.g. -0.01 to match a scenario's nonzev_co2_change.
  new_annual_change: {petrol: 0.0, diesel: 0.0, hybrid: 0.0}

emissions:
  # Tailpipe CO2e only (NAEI category 1A3bi, passenger cars). Electricity is not counted.
  kwh_per_toe: 11630        # 1 toe = 41.868 GJ (IEA/Eurostat definition)
  # kg CO2e per kWh (gross CV), DESNZ GHG conversion factors 2023, "Petrol (average
  # biofuel blend)" / "Diesel (average biofuel blend)", as entered in the notebook
  # (cell 52). Not re-checked against the 2025 factors.
  #   https://www.gov.uk/government/collections/government-conversion-factors-for-company-reporting
  kg_co2e_per_kwh: {petrol: 0.233965161073826, diesel: 0.254092761073826}
  # Scale modelled CO2 to NAEI by the mean NAEI/modelled ratio over the calibration
  # years (the notebook divided by its mean error over all years). The ratio drifts from
  # 0.97 (2014) to 0.91 (2020); validate() reports it by year.
  calibrate_to_naei: true

naei:
  # NAEI devolved-administration GHG inventory, "UK By Source_AR5", row 1A3bi_Cars, kt CO2e.
  #   https://naei.energysecurity.gov.uk/reports/greenhouse-gas-inventories-england-scotland-wales-and-northern-ireland-1990-2020
  file: data/2209201114_DA_GHGI_1990-2020_Final_v4.1_AR4_AR5.xlsm
  sheet: UK By Source_AR5
  row: 1A3bi_Cars
