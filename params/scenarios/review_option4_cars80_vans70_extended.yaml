# ZEV Mandate Review consultation (Aug 2026), Option 4: cars 80% / vans 70% in 2030, flexibilities to 2034.
#   https://www.gov.uk/government/consultations/zero-emission-vehicle-mandate-review
# Not law. Targets 2027-35 are from the consultation's Tables 5 (cars) and 10 (vans).
#
# Flexibilities follow the consultation's illustrative modelling (Table 14, Annex A para 5):
# - Borrowing, banking and car-van exchange continue to 2034, with interest, time limits and
#   exchange rates unchanged. "Generosity ... assumed fixed", read here as the borrowing cap
#   staying at its 2029 level, 10% of the ZEV target, for 2030-34. Repay by 2035.
# - CO2->ZEV conversion cap, as a share of the ZEV target:
#   2027: 70%, 2028: 60%, 2029: 50%, 2030: 50%, 2031: 50%, 2032: 50%, 2033: 50%, 2034: 50%, 2035: 0%
#   Option 4: caps are only described as "more generous than in options 1 to 3". OUR
#   ASSUMPTION: the 2029 level (50% of target) is held to 2034. Change it below to test others.
# - For 2027-29 the caps are re-expressed as shares of this option's targets (para 182: "either a
#   reduction in the CO2 conversion cap or a reduction in the ZEV target will reduce the
#   maximum"). The law states them as shares of registrations, so for options 1-3 this is
#   tighter than keeping the legislated 2027-29 figures.
# The year tables below are cap x target, i.e. shares of registrations, as the engine expects.

extends: ../vets.yaml
name: "Review Option 4: cars 80% / vans 70% in 2030, flexibilities to 2034"
scheme_years: [2024, 2035]

vehicle_types:

  car:
    zev_target: {2027: 0.38, 2028: 0.52, 2029: 0.66, 2030: 0.8, 2031: 0.84, 2032: 0.88, 2033: 0.92, 2034: 0.96, 2035: 1}
    co2_to_zev:
      cap: {2027: 0.266, 2028: 0.312, 2029: 0.33, 2030: 0.4, 2031: 0.42, 2032: 0.44, 2033: 0.46, 2034: 0.48, 2035: 0}
    borrowing:
      cap: {2027: 0.076, 2028: 0.078, 2029: 0.066, 2030: 0.08, 2031: 0.084, 2032: 0.088, 2033: 0.092, 2034: 0.096, 2035: 0}
      repay_by: 2035
    banking:
      last_usable_year: 2035

  van:
    zev_target: {2027: 0.34, 2028: 0.46, 2029: 0.58, 2030: 0.7, 2031: 0.76, 2032: 0.82, 2033: 0.88, 2034: 0.94, 2035: 1}
    co2_to_zev:
      cap: {2027: 0.238, 2028: 0.276, 2029: 0.29, 2030: 0.35, 2031: 0.38, 2032: 0.41, 2033: 0.44, 2034: 0.47, 2035: 0}
    borrowing:
      cap: {2027: 0.068, 2028: 0.069, 2029: 0.058, 2030: 0.07, 2031: 0.076, 2032: 0.082, 2033: 0.088, 2034: 0.094, 2035: 0}
      repay_by: 2035
    banking:
      last_usable_year: 2035


low_volume:
  small_status_excluded_years: [2035]
