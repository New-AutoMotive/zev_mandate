# ZEV Mandate Review consultation (Aug 2026), Option 3: cars 50% / vans 40% in 2030.
#   https://www.gov.uk/government/consultations/zero-emission-vehicle-mandate-review
# Not law. Targets 2027-35 are from the consultation's Tables 2-4 (cars) and 7-9 (vans).
#
# Flexibilities follow the consultation's illustrative modelling (Table 14, Annex A para 5):
# - Borrowing, banking and car-van exchange continue to 2034, with interest, time limits and
#   exchange rates unchanged. "Generosity ... assumed fixed", read here as the borrowing cap
#   staying at its 2029 level, 10% of the ZEV target, for 2030-34. Repay by 2035.
# - CO2->ZEV conversion cap, as a share of the ZEV target:
#   2027: 70%, 2028: 60%, 2029: 50%, 2030: 40%, 2031: 30%, 2032: 20%, 2033: 10%, 2034: 0%, 2035: 0%
#   Options 1-3: "continues from 2029 before ending in 2034, following the trajectory between
#   2025 and 2029", i.e. falling 10 points a year to 0 in 2034.
# - For 2027-29 the caps are re-expressed as shares of this option's targets (para 182: "either a
#   reduction in the CO2 conversion cap or a reduction in the ZEV target will reduce the
#   maximum"). The law states them as shares of registrations, so for options 1-3 this is
#   tighter than keeping the legislated 2027-29 figures.
# The year tables below are cap x target, i.e. shares of registrations, as the engine expects.

extends: ../vets.yaml
name: "Review Option 3: cars 50% / vans 40% in 2030"
scheme_years: [2024, 2035]

vehicle_types:

  car:
    zev_target: {2027: 0.35, 2028: 0.37, 2029: 0.42, 2030: 0.5, 2031: 0.6, 2032: 0.7, 2033: 0.8, 2034: 0.9, 2035: 1}
    co2_to_zev:
      cap: {2027: 0.245, 2028: 0.222, 2029: 0.21, 2030: 0.2, 2031: 0.18, 2032: 0.14, 2033: 0.08, 2034: 0, 2035: 0}
    borrowing:
      cap: {2027: 0.07, 2028: 0.0555, 2029: 0.042, 2030: 0.05, 2031: 0.06, 2032: 0.07, 2033: 0.08, 2034: 0.09, 2035: 0}
      repay_by: 2035
    banking:
      last_usable_year: 2035

  van:
    zev_target: {2027: 0.28, 2028: 0.32, 2029: 0.36, 2030: 0.4, 2031: 0.52, 2032: 0.64, 2033: 0.76, 2034: 0.88, 2035: 1}
    co2_to_zev:
      cap: {2027: 0.196, 2028: 0.192, 2029: 0.18, 2030: 0.16, 2031: 0.156, 2032: 0.128, 2033: 0.076, 2034: 0, 2035: 0}
    borrowing:
      cap: {2027: 0.056, 2028: 0.048, 2029: 0.036, 2030: 0.04, 2031: 0.052, 2032: 0.064, 2033: 0.076, 2034: 0.088, 2035: 0}
      repay_by: 2035
    banking:
      last_usable_year: 2035


low_volume:
  small_status_excluded_years: [2035]
